<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6E8E">
<title>澳門世遺·美食打卡地圖</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232E6E8E'/%3E%3Cpath d='M8 5h8v4H8zM5 10h14v9H5z' fill='%23F5EFE4'/%3E%3Cpath d='M7 13h3v4H7zM13 13h3v4h-3z' fill='%23E8A23A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#F5EFE4;
  --card:#FFFFFF;
  --ink:#28302E;
  --muted:#6E7A74;
  --line:#E6DBC7;
  --blue:#2E6E8E;
  --blue-d:#1F4E5F;
  --terra:#C4572E;
  --terra-l:#F2DCCE;
  --gold:#E8A23A;
  --green:#4E7D5A;
  --red:#C04A3C;
  --casino:#7A5BA0;
  --shadow:0 6px 22px rgba(40,48,46,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  padding-bottom:76px;
}
h1,h2,h3,.serif{font-family:"Noto Serif SC",Georgia,"Songti SC",serif}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
svg{display:block}

/* ===== 頂欄 ===== */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);
  color:#FDF8EF;padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);
}
header .logo{flex:1;min-width:0}
header .logo .t1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;letter-spacing:.5px}
header .logo .t2{font-size:11px;opacity:.85;letter-spacing:1.5px}
.btn-bus{
  display:inline-flex;align-items:center;gap:6px;
  background:#FDF8EF;color:var(--blue-d);
  font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;
}
.btn-bus:hover{background:#fff}

/* ===== 底部導航 ===== */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;
  height:64px;padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--muted);padding:8px 0;font-weight:500;
}
.bottom-nav a.on{color:var(--blue)}
.bottom-nav a svg{width:24px;height:24px}

/* ===== 主區 ===== */
main{max-width:540px;margin:0 auto;padding:0 0 8px}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 首頁 ===== */
.hero{
  margin:12px 14px 6px;padding:18px 16px;border-radius:16px;color:#FDF8EF;
  background:linear-gradient(140deg,#2E6E8E,#1F4E5F 70%);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,162,58,.35),transparent 60%);
}
.hero h1{font-size:24px;font-weight:900;margin-bottom:4px}
.hero p{font-size:13px;opacity:.9}
.hero .stat{display:flex;gap:18px;margin-top:12px;font-size:12px}
.hero .stat b{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--gold);display:block}

.search{display:flex;align-items:center;gap:8px;margin:10px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:none;outline:none;background:none;min-width:0}
.search input::placeholder{color:var(--muted)}

.tabs{display:flex;gap:8px;margin:6px 14px 12px}
.tabs button{flex:1;padding:8px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line)}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.sec-title{display:flex;align-items:center;gap:8px;margin:18px 14px 10px;font-size:15px;font-weight:700;color:var(--blue-d)}
.sec-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--terra)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
@media(min-width:480px){.cards{grid-template-columns:1fr 1fr 1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(40,48,46,.04);
}
.card .thumb{height:96px;background:linear-gradient(140deg,var(--terra-l),#EFE3CE);position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .thumb svg{width:40px;height:40px;color:var(--terra);opacity:.85}
.card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.card .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,36,32,.18),transparent 50%)}
.card .thumb .badge{z-index:1}
.card .badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
.badge.heritage{background:var(--blue)}
.badge.food{background:var(--terra)}
.badge.casino{background:var(--casino)}
.card .body{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .name{font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;line-height:1.3}
.card .meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.card .stars{display:flex;gap:1px}
.card .stars svg{width:13px;height:13px}
.card .foot{margin-top:auto;font-size:11px;color:var(--blue-d);font-weight:700;display:flex;align-items:center;gap:4px}

/* ===== 詳情頁 ===== */
.detail-top{position:relative;min-height:150px;background:linear-gradient(140deg,var(--blue),var(--blue-d));color:#FDF8EF;display:flex;align-items:flex-end;padding:56px 14px 18px;overflow:hidden}
.detail-top::after{content:"";position:absolute;right:-30px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(232,162,58,.4),transparent 60%)}
.btn-back{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.22);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;z-index:2}
.btn-back svg{width:20px;height:20px;color:#fff}
.detail-top h1{font-size:24px;font-weight:900;z-index:1}
.detail-top .sub{font-size:12px;opacity:.9;z-index:1}

.detail{background:var(--card);margin-top:-20px;border-radius:20px 20px 0 0;padding:18px 16px 30px;position:relative}
.row{display:flex;gap:10px;margin-bottom:14px}
.stat-box{flex:1;background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat-box .k{font-size:11px;color:var(--muted)}
.stat-box .v{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;margin-top:2px}
.stat-box .v.gold{color:var(--gold)}
.stat-box .v.lv-hi{color:var(--red)}.stat-box .v.lv-mid{color:var(--gold)}.stat-box .v.lv-lo{color:var(--green)}

.rec{background:var(--terra-l);border-radius:12px;padding:12px 14px;margin:14px 0;display:flex;gap:10px;align-items:flex-start}
.rec svg{width:20px;height:20px;color:var(--terra);flex-shrink:0;margin-top:2px}
.rec .t{font-weight:700;color:var(--terra);font-size:13px}
.rec .d{font-size:13px;color:var(--ink);margin-top:2px}

.chart-box{background:var(--bg);border-radius:12px;padding:12px;margin:14px 0}
.chart-box .ct{font-size:13px;font-weight:700;color:var(--blue-d);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.chart-box .ct svg{width:16px;height:16px}
#trafficChart{width:100%;height:220px}

.h2{font-size:15px;font-weight:700;color:var(--blue-d);display:flex;align-items:center;gap:6px;margin:20px 0 10px}
.h2 svg{width:18px;height:18px;color:var(--terra)}

.spots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spot{background:var(--bg);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center}
.spot svg{width:18px;height:18px;color:var(--terra);flex-shrink:0}
.spot .n{font-size:12.5px;font-weight:500;line-height:1.35}

/* 評分 */
.rate-area{background:var(--bg);border-radius:12px;padding:14px;margin-top:6px}
.rate-area .hint{font-size:12px;color:var(--muted);margin-bottom:8px}
.rate-stars{display:flex;gap:6px;margin-bottom:10px}
.rate-stars .st{cursor:pointer;width:34px;height:34px}
.rate-stars .st svg{width:34px;height:34px;transition:transform .15s}
.rate-stars .st:hover svg{transform:scale(1.12)}
.rate-stars .st svg .in{fill:var(--gold);stroke:var(--gold)}
.rate-stars .st svg .in.off{fill:#E8E0D0;stroke:#D8CDB8}
.rate-avg{font-size:13px;color:var(--muted)}
.rate-avg b{color:var(--gold);font-size:18px}

/* 評論 */
.comments{display:flex;flex-direction:column;gap:10px}
.cmt{background:var(--bg);border-radius:12px;padding:12px}
.cmt .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cmt .who{font-weight:700;font-size:13px}
.cmt .stars{display:flex;gap:1px}
.cmt .stars svg{width:12px;height:12px}
.cmt .txt{font-size:13px}
.cmt .when{font-size:11px;color:var(--muted);margin-top:4px}
.cmt-form{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cmt-form input,.cmt-form textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;resize:none}
.cmt-form textarea{min-height:64px}
.cmt-form .sub{background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:11px;font-size:14px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0}

/* ===== 地圖頁 ===== */
.map-head{padding:14px 14px 0}
.map-head h1{font-size:20px;color:var(--blue-d);font-family:"Noto Serif SC",serif;font-weight:900}
.map-head p{font-size:12px;color:var(--muted);margin-top:2px}
#map{height:62vh;margin:12px 14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);z-index:1}
.legend{display:flex;gap:16px;padding:4px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend .l-heri i{background:var(--blue)}
.legend .l-food i{background:var(--terra)}
.legend .l-casino i{background:var(--casino)}
.leaflet-popup-content{font-family:"Noto Sans SC",sans-serif;line-height:1.5}
.leaflet-popup-content .pn{font-weight:700;font-size:14px;font-family:"Noto Serif SC",serif}
.leaflet-popup-content .pm{font-size:11px;color:var(--muted)}
.leaflet-popup-content a{display:inline-block;margin-top:6px;color:var(--blue);font-weight:700;font-size:12px}

/* Leaflet 圖標自定義 */
.site-pin{background:none;border:none}
.site-pin .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.site-pin .pin svg{transform:rotate(45deg);width:12px;height:12px;color:#fff}

footer{text-align:center;color:var(--muted);font-size:11px;padding:24px 16px 8px;line-height:1.8}
footer .note{max-width:520px;margin:0 auto;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(31,78,95,.95);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="t1">澳門世遺·美食打卡</div>
    <div class="t2">人潮 · 時機 · 網紅打卡點</div>
  </div>
  <button class="btn-bus" onclick="openBus()" aria-label="開啟巴士報站網頁版">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M8 21h8M9 17v4M15 17v4M5 11h14"/></svg>
    巴士報站
  </button>
</header>

<main>
  <!-- ===== 首頁 ===== -->
  <section class="view on" id="view-home">
    <div class="hero">
      <h1>澳門歷史城區·吃喝玩樂</h1>
      <p>世遺景點與人氣餐廳的人潮情報、最佳到訪時機與網紅打卡點</p>
      <div class="stat">
        <div><b id="stPlace">14</b>個地點</div>
        <div><b id="stHeri">8</b>世遺景點</div>
        <div><b id="stFood">6</b>人氣餐廳</div>
        <div><b id="stCasino">1</b>娛樂場</div>
      </div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" placeholder="搜尋地點、區域或美食…" oninput="renderHome()">
    </div>

    <div class="tabs">
      <button class="on" data-tab="all" onclick="setTab('all')">全部</button>
      <button data-tab="heritage" onclick="setTab('heritage')">世遺景點</button>
      <button data-tab="food" onclick="setTab('food')">人氣餐廳</button>
      <button data-tab="casino" onclick="setTab('casino')">酒店娛樂場</button>
    </div>

    <div class="sec-title">推薦地點</div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- ===== 詳情頁 ===== -->
  <section class="view" id="view-detail"></section>

  <!-- ===== 地圖頁 ===== -->
  <section class="view" id="view-map">
    <div class="map-head">
      <h1>景點地圖</h1>
      <p>點擊圖釘查看地點與人潮資訊，可縮放移動</p>
    </div>
    <div id="map"></div>
    <div class="legend">
      <span class="l-heri"><i></i>世遺景點</span>
      <span class="l-food"><i></i>人氣餐廳</span>
      <span class="l-casino"><i></i>酒店娛樂場</span>
    </div>
  </section>
</main>

<div class="bottom-nav">
  <a id="nav-home" href="#/home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></svg>
    探索
  </a>
  <a id="nav-map" href="#/map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3.5 5v16L9 19l6 2 5.5-2V3L15 5 9 3z"/><path d="M9 3v16M15 5v16"/></svg>
    地圖
  </a>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 資料（人潮為典型日參考值，非實時） ===== */
const PLACES = [
  {id:"paulinho",type:"heritage",name:"大三巴牌坊",area:"澳門半島",desc:"澳門地標，昔日聖保祿教堂正面前壁。石階與牌坊下是全天最熱鬧的觀光區。",
   lv:"高",best:"清晨 8 點前或傍晚日落後，避開旅行團 10–17 點高峰",rec:[6,8,18,20],
   traffic:[5,4,4,4,5,8,14,25,42,60,78,88,90,86,80,74,70,64,52,38,28,20,14,8],
   spots:["牌坊正面石階","牌坊側面小巷","大三巴街仰望視角"],coord:[22.1975,113.5410],img:"assets/san-daba.jpg"},
  {id:"senado",type:"heritage",name:"議事亭前地",area:"澳門半島",desc:"葡式碎石地面的廣場，被粉黃色葡式建築包圍，是澳門歷史城區的心臟。",
   lv:"高",best:"平日早上 9–11 點人流較少，傍晚燈光亮起最浪漫",rec:[9,11,18,20],
   traffic:[4,3,3,3,5,9,16,28,45,60,75,85,88,84,78,72,66,58,46,34,25,18,12,7],
   spots:["中央噴水池","碎石波浪地面","仁慈堂側拱廊"],coord:[22.1935,113.5395],img:"assets/senate-square.jpg"},
  {id:"fortress",type:"heritage",name:"大炮台",area:"澳門半島",desc:"建於 1617 年的軍事要塞，可俯瞰整個舊城區與新葡京天際線。",
   lv:"中",best:"下午 4–6 點登台看日落，人潮已散",rec:[16,18],
   traffic:[3,3,3,3,4,7,12,20,30,42,55,65,68,64,58,55,50,44,34,24,16,12,8,5],
   spots:["城牆炮位","炮台俯瞰天台","入口石梯"],coord:[22.1968,113.5422],img:"assets/monte-fort.jpg"},
  {id:"domingos",type:"heritage",name:"玫瑰堂",area:"澳門半島",desc:"粉黃色巴洛克立面教堂，內部有大量葡式雕塑與彩繪玻璃。",
   lv:"中",best:"平日中午時段相對清靜",rec:[11,14],
   traffic:[3,2,2,2,4,7,12,20,30,40,50,58,60,56,50,46,42,36,28,20,14,10,7,4],
   spots:["巴洛克立面","教堂前窄巷","對街拍全景"],coord:[22.1944,113.5402],img:"assets/st-domingos.jpg"},
  {id:"ama",type:"heritage",name:"媽閣廟",area:"澳門半島",desc:"澳門最古老廟宇，供奉海上守護神媽祖，澳門(Macao)之名即源於此。",
   lv:"中",best:"上午前往，廟內石階清幽",rec:[8,11],
   traffic:[4,4,4,4,6,10,18,28,40,50,60,62,58,52,48,44,40,34,26,18,12,9,6,5],
   spots:["正門石獅","弘仁殿前庭","山海關石門"],coord:[22.1859,113.5291],img:"assets/a-ma-temple.jpg"},
  {id:"guia",type:"heritage",name:"東望洋燈塔",area:"澳門半島",desc:"中國沿海最古老燈塔之一，塔頂俯瞰澳門半島全景，日出與日落皆絕美。",
   lv:"中",best:"上午或日落前 1 小時上山",rec:[8,10,17,19],
   traffic:[2,2,2,2,3,6,10,16,24,34,44,52,55,50,45,48,50,44,30,20,12,8,5,3],
   spots:["燈塔觀景台","炮台城牆","雪地聖母小堂"],coord:[22.1953,113.5484],img:"assets/guia-lighthouse.jpg"},

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const busUrl="https://www.dsat.gov.mo/bus/site/index.aspx";
function openBus(){window.open(busUrl,"_blank","noopener");}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
function starSVG(filled){
  const fill=filled?"fill=\"#E8A23A\" stroke=\"#E8A23A\"":"fill=\"#E8E0D0\" stroke=\"#D8CDB8\"";
  return `<svg viewBox="0 0 24 24" ${fill} stroke-width="1.4" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.6l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
}
function starsHTML(r,n=5){let s="";for(let i=0;i<n;i++)s+=starSVG(i<Math.round(r));return s;}
function lvClass(lv){return lv==="高"?"lv-hi":lv==="中"?"lv-mid":"lv-lo";}
function typeLabel(t){return t==="heritage"?"世遺景點":t==="casino"?"酒店娛樂場":"人氣餐廳";}
function typeIcon(t){
  if(t==="heritage")return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M10 21v-6h4v6"/></svg>`;
  if(t==="casino")return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 9.5V20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9.5"/><path d="M3 9.5h18L16 3H8z"/><path d="M12 13v4M10 15h4"/></svg>`;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 7h16v9H4zM8 20h8M7 3h10l2 4H5z"/><circle cx="8" cy="11.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="11.5" r="1.3" fill="currentColor" stroke="none"/></svg>`;
}

/* 本地儲存：評分與評論 */
function rateKey(id){return "mc_rate_"+id;}
function cmtKey(id){return "mc_cmt_"+id;}
function getRate(id){const r=JSON.parse(localStorage.getItem(rateKey(id))||"null");return r||{sum:0,n:0};}
function getAvg(id){const seed=SEED_RATE[id]||[4,0];const r=getRate(id);const tot=seed[0]*seed[1]+r.sum;const cnt=seed[1]+r.n;return cnt?tot/cnt:0;}
function getCnt(id){const seed=SEED_RATE[id]||[4,0];return seed[1]+getRate(id).n;}
function getCmt(id){
  const seed=(SEED_CMT[id]||[]).map(c=>({who:c[0],txt:c[1]}));
  return seed.concat(JSON.parse(localStorage.getItem(cmtKey(id))||"[]"));
}

/* ===== 路由 ===== */
let curTab="all";
function setTab(t){curTab=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));renderHome();}
function router(){
  const h=location.hash.replace(/^#\/?/,"").split("/");
  const view=h[0]||"home";
  if(view==="home"){show("view-home");renderHome();setNav("nav-home");}
  else if(view==="map"){show("view-map");setNav("nav-map");initMap();}
  else if(view==="place"&&h[1]){show("view-detail");renderDetail(h[1]);}
  else{show("view-home");renderHome();setNav("nav-home");}
  window.scrollTo(0,0);
}
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));$("#"+id).classList.add("on");}
function setNav(id){document.querySelectorAll(".bottom-nav a").forEach(a=>a.classList.remove("on"));$("#"+id).classList.add("on");}
window.addEventListener("hashchange",router);
window.addEventListener("load",router);

/* ===== 首頁 ===== */
function renderHome(){
  const q=($("#searchInput").value||"").trim().toLowerCase();
  const list=PLACES.filter(p=>{
    const okT=curTab==="all"||p.type===curTab;
    const hay=(p.name+p.area+p.desc+p.type==="food"?"美食":"景點").toLowerCase();
    return okT&&(q===""||hay.includes(q)||p.name.toLowerCase().includes(q)||p.area.includes(q));
  });
  $("#stPlace").textContent=PLACES.length;
  $("#stHeri").textContent=PLACES.filter(p=>p.type==="heritage").length;
  $("#stFood").textContent=PLACES.filter(p=>p.type==="food").length;
  $("#stCasino").textContent=PLACES.filter(p=>p.type==="casino").length;
  const box=$("#cards");
  if(!list.length){box.innerHTML=`<div class="empty" style="grid-column:1/-1">找不到符合的地點</div>`;return;}
  box.innerHTML=list.map(p=>{
    const avg=getAvg(p.id).toFixed(1);
    const b=p.type;
    const icon=typeIcon(p.type);
    const thumb=p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:icon;
    return `<a class="card" href="#/place/${p.id}">
      <div class="thumb">${thumb}<span class="badge ${b}">${typeLabel(p.type)}</span></div>
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="meta"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5-7-11a7 7 0 0 1 14 0c0 6-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${p.area}</div>
        <div class="stars">${starsHTML(avg)}<span style="font-size:11px;color:var(--muted);margin-left:3px">${avg}</span></div>
        <div class="foot"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/></svg>人潮 ${p.lv} · ${p.best.split("，")[0]}</div>
      </div>
    </a>`;
  }).join("");
}

/* ===== 詳情頁 ===== */
let chart=null;
function renderDetail(id){
  const p=PLACES.find(x=>x.id===id);if(!p){location.hash="#/home";return;}
  const avg=getAvg(id).toFixed(1);
  const icon=typeIcon(p.type);
  const lvClassN=lvClass(p.lv);
  $("#view-detail").innerHTML=`
    <div class="detail-top"${p.img?` style="background:linear-gradient(180deg,rgba(20,38,44,.30),rgba(20,38,44,.68)),url('${p.img}') center/cover no-repeat"`:""}>
      <button class="btn-back" onclick="history.back()" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div style="width:100%">
        <div style="font-size:11px;opacity:.85;z-index:1">${p.area} · ${typeLabel(p.type)}</div>
        <h1>${p.name}</h1>
        <div class="sub">${p.desc}</div>
      </div>
    </div>
    <div class="detail">
      <div class="row">
        <div class="stat-box"><div class="k">綜合評分</div><div class="v gold">★ ${avg}</div><div style="font-size:11px;color:var(--muted)">${getCnt(id)} 人評</div></div>
        <div class="stat-box"><div class="k">人潮程度</div><div class="v ${lvClassN}">${p.lv}</div><div style="font-size:11px;color:var(--muted)">${p.type==="casino"?"客流量":p.type==="heritage"?"觀光客":"排隊情況"}</div></div>
        <div class="stat-box"><div class="k">推薦前往</div><div class="v" style="font-size:13px">${p.rec.map(h=>h+"時").join("、")}</div></div>
      </div>

      <div class="rec">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <div><div class="t">最佳到訪時機</div><div class="d">${p.best}</div></div>
      </div>

      <div class="chart-box">
        <div class="ct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h3l2.5-6 3 12 2.5-8 2 2h5"/></svg>24 小時人潮曲線（參考）</div>
        <div id="trafficChart"></div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">數值為相對人潮指數（0–100），綠色區間為推薦到訪時段</div>
      </div>

      <div class="h2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 4v8h14v-8l-5-4V3M8 21h8"/></svg>網紅打卡點</div>
      <div class="spots">${p.spots.map(s=>`<div class="spot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5-7-11a7 7 0 0 1 14 0c0 6-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span class="n">${esc(s)}</span></div>`).join("")}</div>

      <button class="btn-bus" style="margin-top:16px;width:100%;justify-content:center;background:var(--blue);color:#fff;box-shadow:none" onclick="openBus()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M8 21h8M9 17v4M15 17v4M5 11h14"/></svg>
        查看巴士報站（網頁版）
      </button>

      <div class="h2" style="margin-top:26px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.5L18 9l-4.4 1.5L12 15l-1.6-4.5L6 9l4.4-1.5z"/></svg>為此地點評分</div>
      <div class="rate-area">
        <div class="hint">你覺得這裡值不值得去？（1 星最低，5 星最高）</div>
        <div class="rate-stars" id="rateStars"></div>
        <div class="rate-avg">目前平均 <b>${avg}</b> / 5（${getCnt(id)} 人評分）</div>
      </div>

      <div class="h2" style="margin-top:26px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l3-3a8 8 0 1 1 13-5z"/></svg>評論區</div>
      <div class="comments" id="cmtList"></div>
      <form class="cmt-form" onsubmit="submitCmt(event,'${p.id}')">
        <input id="cmtName" placeholder="你的暱稱" required maxlength="12">
        <textarea id="cmtText" placeholder="分享你的到訪體驗、排隊情況或拍照心得…" required maxlength="200"></textarea>
        <button class="sub" type="submit">發布評論</button>
      </form>
    </div>`;

  buildRateStars(id);
  renderCmt(id);
  drawChart(p);
  window.scrollTo(0,0);
}

/* 評分互動 */
let myPick=0;
function buildRateStars(id){
  const box=$("#rateStars");myPick=getRate(id).my||0;box.innerHTML="";
  for(let i=1;i<=5;i++)box.appendChild(starButton(i,myPick>=i));
}
function starButton(i,on){
  const b=document.createElement("button");
  b.className="st";b.type="button";b.setAttribute("aria-label",i+"星");
  b.innerHTML=starSVG(on);
  b.onmouseenter=()=>preview(i);
  b.onmouseleave=()=>restore();
  b.onclick=()=>pick(i);
  return b;
}
function preview(i){document.querySelectorAll("#rateStars .st").forEach((s,k)=>s.innerHTML=starSVG(k<i));}
function restore(){document.querySelectorAll("#rateStars .st").forEach((s,k)=>s.innerHTML=starSVG(k<myPick));}
function pick(i){
  const id=curId();if(!id)return;
  myPick=i;const r=getRate(id);r.sum+=i;r.n+=1;r.my=i;
  localStorage.setItem(rateKey(id),JSON.stringify(r));
  buildRateStars(id);
  toast("已記錄你的評分，感謝回饋");
  const avg=getAvg(id).toFixed(1);
  const av=document.querySelector(".rate-avg");if(av)av.innerHTML=`目前平均 <b>${avg}</b> / 5（${getCnt(id)} 人評分）`;
  const sv=document.querySelector(".stat-box .v.gold");if(sv)sv.textContent="★ "+avg;
}
let _curId="";
function curId(){const m=location.hash.match(/place\/([\w-]+)/);return m?m[1]:"";}

/* 評論 */
function submitCmt(e,id){
  e.preventDefault();
  const n=$("#cmtName").value.trim(),t=$("#cmtText").value.trim();
  if(!n||!t)return;
  const list=JSON.parse(localStorage.getItem(cmtKey(id))||"[]");
  list.unshift({who:n,txt:t,when:new Date().toLocaleString("zh-Hant",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})});
  localStorage.setItem(cmtKey(id),JSON.stringify(list));
  e.target.reset();
  renderCmt(id);
  toast("評論已發布");
}
function renderCmt(id){
  const list=getCmt(id);const box=$("#cmtList");
  if(!list.length){box.innerHTML=`<div class="empty">還沒有評論，來搶頭香吧</div>`;return;}
  box.innerHTML=list.map(c=>`
    <div class="cmt">
      <div class="h"><span class="who">${esc(c.who)}</span></div>
      <div class="txt">${esc(c.txt)}</div>
      ${c.when?`<div class="when">${esc(c.when)}</div>`:""}
    </div>`).join("");
}

/* 人潮圖表 */
function drawChart(p){
  const hours=p.traffic.map((v,i)=>({v,h:i}));
  const rec=Array.from({length:24},(_,h)=>p.rec.some((r,i)=>i%2===0&&h>=r&&h<r+2)?0:30);
  if(chart)chart.dispose();
  chart=echarts.init($("#trafficChart"));
  chart.setOption({
    grid:{left:34,right:14,top:16,bottom:26},
    tooltip:{trigger:"axis",formatter:params=>params[0].axisValue+"時 · 人潮指數 "+(params[0].value-30),backgroundColor:"rgba(31,78,95,.95)",textStyle:{color:"#fff",fontSize:12}},
    xAxis:{type:"category",data:Array.from({length:24},(_,h)=>h+"時"),axisLine:{lineStyle:{color:"#D8CDB8"}},axisLabel:{color:"#6E7A74",fontSize:10,interval:2}},
    yAxis:{type:"value",show:false,min:0,max:100},
    series:[
      {name:"推薦",type:"bar",data:rec,barWidth:"70%",itemStyle:{color:"rgba(78,125,90,.35)",borderRadius:[0,0,4,4]},stack:"a"},
      {name:"人潮",type:"bar",data:p.traffic,barWidth:"70%",itemStyle:{color:"#2E6E8E",borderRadius:[4,4,0,0]},stack:"a"}
    ]
  });
}

/* ===== 地圖 ===== */
let mapInit=false,map=null,tileIdx=0;
const TILE_PROVIDERS=[
  {url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",attr:'&copy; <a href="https://www.esri.com">Esri</a>'},
  {url:"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",sub:"abc",attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'},
  {url:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",sub:"abcd",attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'},
  {url:"https://tile.openfreemap.org/styles/liberty/{z}/{x}/{y}.png",attr:'&copy; OpenStreetMap contributors &copy; OpenFreeMap'}
];
function loadTiles(){
  const p=TILE_PROVIDERS[tileIdx];
  const layer=L.tileLayer(p.url,{maxZoom:19,subdomains:p.sub||"abc",attribution:p.attr,
    errorTileUrl:"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="});
  layer.on("tileerror",()=>{ if(tileIdx<TILE_PROVIDERS.length-1){tileIdx++;map.removeLayer(layer);loadTiles();} });
  layer.addTo(map);
  return layer;
}
function initMap(){
  if(mapInit)return;
  map=L.map("map").setView([22.18,113.543],13);
  loadTiles();
  const colors={heritage:"#2E6E8E",food:"#C4572E",casino:"#7A5BA0"};
  PLACES.forEach(p=>{
    const pin=L.divIcon({className:"site-pin",html:`<div class="pin" style="background:${colors[p.type]}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-26]});
    L.marker(p.coord,{icon:pin}).addTo(map)
      .bindPopup(`<div class="pn">${p.name}</div><div class="pm">${p.area} · ${typeLabel(p.type)} · 人潮 ${p.lv}</div><a href="#/place/${p.id}">查看詳情 →</a>`);
  });
  mapInit=true;
}
</script>
</body>
